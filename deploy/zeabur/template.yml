          icon: https://avatars.githubusercontent.com/u/198419463?s=96&v=4
          dependencies:
            - postgres
            - postgrest
            - deno
          template: PREBUILT_V2
          spec:
            source:
                image: ghcr.io/insforge/insforge-oss:latest
            ports:
                - id: web
                  port: 7130
                  type: HTTP
                - id: dev
                  port: 7131
                  type: HTTP
            env:
                PORT:
                    default: "7130"
                PROJECT_ROOT:
                    default: /app
                API_BASE_URL:
                    default: ${ZEABUR_WEB_URL}
                VITE_API_BASE_URL:
                    default: ${ZEABUR_WEB_URL}
                JWT_SECRET:
                    default: ${PGRST_JWT_SECRET}
                ROOT_ADMIN_USERNAME:
                    default: ${ROOT_ADMIN_USERNAME}
                ROOT_ADMIN_PASSWORD:
                    default: ${ROOT_ADMIN_PASSWORD}
                # PostgreSQL connection
                POSTGRES_HOST:
                    default: postgres
                POSTGRES_PORT:
                    default: "5432"
                POSTGRES_DB:
                    default: insforge
                POSTGRES_USER:
                    default: postgres
                POSTGRESDB_PASSWORD:
                    default: ${PGPASSWORD}
                DATABASE_URL:
                    default: postgres://postgres:${PGPASSWORD}@postgres:5432/insforge
                POSTGREST_BASE_URL:
                    default: http://postgrest:3000
                # Deno Runtime URL for serverless functions
                DENO_RUNTIME_URL:
                    default: http://deno:7133
                # OAuth Configuration (optional)
                GOOGLE_CLIENT_ID:
                    default: ""
                GOOGLE_CLIENT_SECRET:
                    default: ""
                GOOGLE_REDIRECT_URI:
                    default: ${ZEABUR_WEB_URL}/api/auth/v1/callback
                GITHUB_CLIENT_ID:
                    default: ""
                GITHUB_CLIENT_SECRET:
                    default: ""
                GITHUB_REDIRECT_URI:
                    default: ${ZEABUR_WEB_URL}/api/auth/v1/callback
                # Multi-tenant Cloud Configuration
                DEPLOYMENT_ID:
                    default: ${ZEABUR_SERVICE_ID}
                PROJECT_ID:
                    default: ${ZEABUR_PROJECT_ID}
                APP_KEY:
                    default: ""
                ACCESS_API_KEY:
                    default: ""
                ACCESS_ANON_KEY:
                    default: ""
                OPENROUTER_API_KEY:
                    default: ${OPENROUTER_API_KEY}
                STRIPE_TEST_SECRET_KEY:
                    default: ${STRIPE_TEST_SECRET_KEY}
                STRIPE_LIVE_SECRET_KEY:
                    default: ${STRIPE_LIVE_SECRET_KEY}
            healthCheck:
                type: HTTP
                port: web
                http:
                    path: /api/health
          domainKey: PUBLIC_DOMAIN

