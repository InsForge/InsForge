openapi: 3.0.3
info:
  title: Insforge Logs API
  version: 1.0.0

paths:
  /api/logs/audits:
    get:
      summary: List audit logs
      description: |
        Paginated activity log. Responses use the PostgREST-style contract from
        `paginatedResponse`: `206 Partial Content` with a `Content-Range` header
        when the page is a subset, `200` when it returns everything.
      tags:
        - Admin
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: actor
          in: query
          schema:
            type: string
          description: Filter by the actor that performed the action
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action name
        - name: module
          in: query
          schema:
            type: string
          description: Filter by the module the action belongs to
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: All matching audit logs were returned
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Range and total, e.g. `0-9/10`'
            Preference-Applied:
              schema:
                type: string
              description: Always `count=exact`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '206':
          description: A page of audit logs, with more available
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Range and total, e.g. `0-99/1234`'
            Preference-Applied:
              schema:
                type: string
              description: Always `count=exact`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
              example:
                - id: "audit-123"
                  actor: "admin@example.com"
                  action: "START_DEPLOYMENT"
                  module: "DEPLOYMENTS"
                  details:
                    id: "dep-456"
                  ipAddress: "192.168.1.1"
                  createdAt: "2024-01-21T10:30:00Z"
                  updatedAt: "2024-01-21T10:30:00Z"

    delete:
      summary: Clear audit logs
      tags:
        - Admin
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: days_to_keep
          in: query
          schema:
            type: integer
            default: 90
          description: Audit logs older than this many days are deleted
      responses:
        '200':
          description: Audit logs cleared
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - deleted
                properties:
                  message:
                    type: string
                  deleted:
                    type: integer
              example:
                message: "Audit logs cleared successfully"
                deleted: 150

  /api/logs/stats:
    get:
      summary: Per-source log statistics
      description: |
        One entry per system log source. This is not the audit-log summary;
        that lives at `/api/logs/audits/stats`.
      tags:
        - Admin
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        '200':
          description: Statistics for each log source
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - source
                    - count
                    - lastActivity
                  properties:
                    source:
                      type: string
                    count:
                      type: integer
                    lastActivity:
                      type: string
                      format: date-time
              example:
                - source: "postgres"
                  count: 1035
                  lastActivity: "2024-01-21T10:31:00Z"
                - source: "deno-relay"
                  count: 47
                  lastActivity: "2024-01-21T09:58:00Z"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  
  schemas:
    AuditLog:
      type: object
      required:
        - id
        - actor
        - action
        - module
        - details
        - ipAddress
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        module:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
        message:
          type: string
          description: Human-readable error message
        statusCode:
          type: integer
          description: HTTP status code
        nextAction:
          type: string
          description: Suggested action to resolve the error