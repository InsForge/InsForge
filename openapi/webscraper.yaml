openapi: 3.0.3

info:
  title: InsForge Webscraper API
  version: 1.0.0
  description: Administrative API for managing Apify integration and accessing Apify resources

paths:
  /api/webscraper/apify/connection:
    get:
      summary: Get Apify connection
      description: Returns the current Apify connection status and connection metadata
      tags:
        - Apify
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Apify is connected
          content:
            application/json:
              schema:
                type: object
                required:
                  - connected
                  - connection
                properties:
                  connected:
                    type: boolean
                  connection:
                    $ref: '#/components/schemas/ApifyConnection'
              example:
                connected: true
                connection:
                  apifyUsername: "apify-user"
                  apifyEmail: "user@example.com"
                  connectedAt: "2026-08-16T12:00:00.000Z"
        '404':
          description: Apify is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConnectedError'
              example:
                error: "not_connected"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to retrieve connection from Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve Apify connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Disconnect Apify
      description: Disconnect the project's Apify integration
      tags:
        - Apify
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Apify disconnected successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to disconnect Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webscraper/apify/token:
    get:
      summary: Get Apify API token
      description: Retrieve the configured Apify API token. Admin only because this endpoint returns the sensitive token value.
      tags:
        - Apify
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Apify API token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApifyTokenResponse'
              example:
                accessToken: "apify_api_xxxxxxxxxxxxxxxxxxxx"
        '404':
          description: Apify is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConnectedError'
              example:
                error: "not_connected"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to retrieve Apify token from upstream provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve Apify token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webscraper/apify/runs:
    get:
      summary: List Apify runs
      description: Returns recent Apify actor runs
      tags:
        - Apify
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of runs to return
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
          example: 10
      responses:
        '200':
          description: List of Apify runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApifyRunsResponse'
        '404':
          description: Apify is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConnectedError'
              example:
                error: "not_connected"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to retrieve runs from Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve Apify runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webscraper/apify/actors:
    get:
      summary: List Apify actors
      description: Returns recently used Apify actors
      tags:
        - Apify
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of actors to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: List of Apify actors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApifyActorsResponse'
        '404':
          description: Apify is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConnectedError'
              example:
                error: "not_connected"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to retrieve actors from Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve Apify actors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webscraper/apify/datasets:
    get:
      summary: List Apify datasets
      description: Returns recently created Apify datasets
      tags:
        - Apify
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of datasets to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
      responses:
        '200':
          description: List of Apify datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApifyDatasetsResponse'
        '404':
          description: Apify is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConnectedError'
              example:
                error: "not_connected"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to retrieve datasets from Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve Apify datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webscraper/apify/data:
    get:
      summary: Get latest Apify data
      description: Returns a preview of records from the latest Apify run dataset
      tags:
        - Apify
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of dataset records to return
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          example: 5
      responses:
        '200':
          description: Latest Apify dataset records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApifyLatestDataResponse'
              example:
                datasetId: "abc123"
                items:
                  - title: "Example"
                    url: "https://example.com"
        '404':
          description: Apify is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotConnectedError'
              example:
                error: "not_connected"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to retrieve latest data from Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve latest Apify data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webscraper/apify/config:
    put:
      summary: Configure Apify API token
      description: >-
        Validate and store an Apify API token for self-hosted deployments.
        The token is verified against Apify before it is persisted.
        This endpoint is not available in InsForge Cloud because Cloud
        manages the Apify connection through OAuth.
      tags:
        - Apify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApifyConfigRequest'
            example:
              apiToken: "apify_api_xxxxxxxxxxxxxxxxxxxx"
      responses:
        '200':
          description: Apify configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApifyConfig'
              example:
                token:
                  configured: true
                  maskedKey: "apify_api••••••••1234"
        '400':
          description: Invalid input or Apify configuration is managed by InsForge Cloud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: "INVALID_INPUT"
                    message: "Validation error: API token is required"
                    statusCode: 400
                cloudEnvironment:
                  value:
                    error: "INVALID_INPUT"
                    message: "The Apify connection is managed by InsForge Cloud."
                    statusCode: 400
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Failed to validate Apify token with upstream provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to configure Apify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApifyConnection:
      type: object
      description: Apify connection metadata returned by the configured provider
      required:
        - apifyUsername
      properties:
        apifyUsername:
          type: string
          description: Apify username associated with the connection
        apifyEmail:
          type: string
          format: email
          nullable: true
          description: Apify account email address
        connectedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the Apify connection was established
      additionalProperties: true
      example:
        apifyUsername: "apify-user"
        apifyEmail: "user@example.com"
        connectedAt: "2026-08-16T12:00:00.000Z"

    ApifyTokenResponse:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: Apify API access token
      additionalProperties: false

    ApifyConfigRequest:
      type: object
      required:
        - apiToken
      properties:
        apiToken:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '.*\S.*'
          description: Apify API token. Must contain at least one non-whitespace character.
          example: "apify_api_xxxxxxxxxxxxxxxxxxxx"
      additionalProperties: false

    ApifyConfig:
      type: object
      required:
        - token
      properties:
        token:
          type: object
          required:
            - configured
            - maskedKey
          properties:
            configured:
              type: boolean
              description: Whether an Apify API token is configured
            maskedKey:
              type: string
              nullable: true
              description: Masked representation of the Apify API token
          additionalProperties: false
          example:
            configured: true
            maskedKey: "apify_api••••••••1234"
      additionalProperties: false

    ApifyRun:
      type: object
      description: Apify actor run
      required:
        - id
      properties:
        id:
          type: string
          description: Unique Apify run ID
        actId:
          type: string
          nullable: true
          description: Apify actor ID
        status:
          type: string
          description: Run status
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        defaultDatasetId:
          type: string
          nullable: true
          description: Dataset generated by the run
      additionalProperties: true

    ApifyRunsResponse:
      type: object
      required:
        - runs
      properties:
        runs:
          type: array
          description: Apify actor runs
          items:
            $ref: '#/components/schemas/ApifyRun'
      additionalProperties: false

    ApifyActor:
      type: object
      description: Apify actor
      required:
        - id
      properties:
        id:
          type: string
          description: Unique Apify actor ID
        name:
          type: string
          nullable: true
          description: Actor name
        username:
          type: string
          nullable: true
          description: Apify username that owns the actor
        title:
          type: string
          nullable: true
          description: Actor title
      additionalProperties: true

    ApifyActorsResponse:
      type: object
      required:
        - actors
      properties:
        actors:
          type: array
          description: Apify actors
          items:
            $ref: '#/components/schemas/ApifyActor'
      additionalProperties: false

    ApifyDataset:
      type: object
      description: Apify dataset
      required:
        - id
      properties:
        id:
          type: string
          description: Unique Apify dataset ID
        name:
          type: string
          nullable: true
          description: Dataset name
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Dataset creation timestamp
        itemCount:
          type: integer
          minimum: 0
          nullable: true
          description: Number of records in the dataset
      additionalProperties: true

    ApifyDatasetsResponse:
      type: object
      required:
        - datasets
      properties:
        datasets:
          type: array
          description: Apify datasets
          items:
            $ref: '#/components/schemas/ApifyDataset'
      additionalProperties: false

    ApifyLatestDataResponse:
      type: object
      required:
        - datasetId
        - items
      properties:
        datasetId:
          type: string
          nullable: true
          description: ID of the latest Apify dataset
        items:
          type: array
          description: Records from the latest Apify dataset
          items:
            type: object
            additionalProperties: true
      additionalProperties: false

    NotConnectedError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - not_connected
          description: Indicates that Apify is not connected
          example: "not_connected"
      additionalProperties: false

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid input data"
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: "Check the request body format"