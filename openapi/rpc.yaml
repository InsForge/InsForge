openapi: 3.0.3
info:
  title: Insforge RPC API
  version: 2.0.0
  description: |
    Calls Postgres functions through PostgREST's `/rpc` interface.

    Requests are forwarded to PostgREST as the caller: project admins and API
    key holders are forwarded with admin rights, signed-in users with their own
    role, and anonymous callers as `anon`. Row level security therefore applies
    exactly as it does for record queries.

    The response body is whatever the function returns, so its shape depends on
    the function being called.

    Failures come from two places, and the body differs accordingly. A rejected
    function name is produced by this service and uses the platform
    `ErrorResponse` shape. Anything PostgREST rejects is forwarded verbatim, so
    the body is PostgREST's own `code`, `message`, `details` and `hint`.

paths:
  /api/database/rpc/{functionName}:
    post:
      summary: Call Function
      description: |
        Calls a Postgres function with named arguments supplied in the request
        body. This is the usual way to call a function, and the only way to call
        one that modifies data.

        Use this method when a function has an argument named `schema`, since
        `schema` is reserved as a query parameter and is not forwarded as an
        argument.
      tags:
        - Client
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
          description: Name of the Postgres function to call
          example: search_posts
        - name: schema
          in: query
          schema:
            type: string
          description: |
            Schema that owns the function. Reserved: it is consumed here,
            desugared into PostgREST's `Content-Profile` header, and stripped
            from the forwarded query rather than passed to the function.
            Defaults to the public schema.
          example: analytics
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Named arguments for the function
            example:
              term: "postgres"
              limit: 10
      responses:
        '200':
          description: Function result. The shape depends on the function.
          content:
            application/json:
              schema:
                description: Whatever the function returns
              examples:
                rows:
                  summary: Function returning a set of rows
                  value:
                    - id: "123e4567-e89b-12d3-a456-426614174000"
                      title: "Getting started with Postgres"
                scalar:
                  summary: Function returning a scalar
                  value: 42
        '400':
          description: |
            Either the function name was rejected here, or PostgREST rejected the
            request itself. The two cases return different bodies.

            Note that an argument-name mismatch is NOT a 400: PostgREST cannot
            resolve the signature, so it reports `PGRST202` as a 404. See that
            response below.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/PostgrestError'
              examples:
                rejected_name:
                  summary: Function name rejected by this service
                  value:
                    error: "DATABASE_VALIDATION_ERROR"
                    message: "Invalid function name: cannot contain quotes or control characters"
                    statusCode: 400
                    nextActions: "The function name cannot contain double quotes or control characters (tabs, newlines, etc.)"
                postgrest_rejected:
                  summary: Request body rejected by PostgREST, body forwarded verbatim
                  value:
                    code: "PGRST102"
                    message: "Failed to parse request body"
                    details: "Empty or invalid json"
                    hint: null
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Like the 400, this status has two bodies, because either layer can
            refuse.

            The proxy refuses first when the JWT is valid but carries a role it
            will not forward as: anything other than `project_admin`,
            `authenticated` or `anon`, for example a role minted by hand. That is
            rejected before PostgREST is contacted, so the body is the platform
            envelope.

            PostgREST refuses when the resolved database role may not execute the
            function, or when a policy denies it. That body is forwarded
            unchanged, so it is PostgREST's.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/PostgrestError'
              examples:
                proxy_refused_role:
                  summary: Role refused by this proxy before PostgREST is contacted
                  value:
                    error: "AUTH_UNAUTHORIZED"
                    message: "Invalid user role claim"
                    statusCode: 403
                postgrest_denied:
                  summary: Denied by PostgREST, body forwarded verbatim
                  value:
                    code: "42501"
                    message: "permission denied for function search_posts"
                    details: null
                    hint: null
        '404':
          description: |
            Function not found in the target schema. Reported by PostgREST and
            forwarded verbatim, so the body is PostgREST's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
              example:
                code: "PGRST202"
                message: "Could not find the function public.missing_fn in the schema cache"
                details: null
                hint: null
    get:
      summary: Call Function (read only)
      description: |
        Calls a function that is marked `STABLE` or `IMMUTABLE`, passing
        arguments as query parameters. PostgREST rejects `GET` for functions
        that write, so use `POST` for those.

        `schema` is reserved as a query parameter, so a function argument of
        that name cannot be sent this way. Call such a function with `POST` and
        put the argument in the JSON body.
      tags:
        - Client
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: functionName
          in: path
          required: true
          schema:
            type: string
          description: Name of the Postgres function to call
          example: search_posts
        - name: schema
          in: query
          schema:
            type: string
          description: |
            Schema that owns the function. Reserved: it is consumed here,
            desugared into PostgREST's `Accept-Profile` header, and stripped
            from the forwarded query rather than passed to the function.
            Defaults to the public schema.
          example: analytics
      responses:
        '200':
          description: Function result. The shape depends on the function.
          content:
            application/json:
              schema:
                description: Whatever the function returns
        '400':
          description: |
            Either the function name was rejected here, or PostgREST rejected the
            request itself. The two cases return different bodies.

            Note that an argument-name mismatch is NOT a 400: PostgREST cannot
            resolve the signature, so it reports `PGRST202` as a 404. See that
            response below.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/PostgrestError'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Like the 400, this status has two bodies, because either layer can
            refuse.

            The proxy refuses first when the JWT is valid but carries a role it
            will not forward as: anything other than `project_admin`,
            `authenticated` or `anon`, for example a role minted by hand. That is
            rejected before PostgREST is contacted, so the body is the platform
            envelope.

            PostgREST refuses when the resolved database role may not execute the
            function, or when a policy denies it. That body is forwarded
            unchanged, so it is PostgREST's.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/PostgrestError'
              examples:
                proxy_refused_role:
                  summary: Role refused by this proxy before PostgREST is contacted
                  value:
                    error: "AUTH_UNAUTHORIZED"
                    message: "Invalid user role claim"
                    statusCode: 403
                postgrest_denied:
                  summary: Denied by PostgREST, body forwarded verbatim
                  value:
                    code: "42501"
                    message: "permission denied for function search_posts"
                    details: null
                    hint: null
        '404':
          description: |
            Function not found in the target schema. Reported by PostgREST and
            forwarded verbatim, so the body is PostgREST's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    PostgrestError:
      type: object
      required:
        - code
        - message
      description: |
        Error body produced by PostgREST and forwarded unchanged by the proxy.
        Upstream failures are not reshaped, so the fields are PostgREST's, not
        the platform `ErrorResponse` used elsewhere.
      properties:
        code:
          type: string
          description: PostgREST or Postgres error code
          example: PGRST202
        message:
          type: string
          example: "Could not find the function public.missing_fn in the schema cache"
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid function name: search posts"
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested remediation, when the API can offer one
