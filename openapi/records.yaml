components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    PostgrestError:
      type: object
      description: |
        Error body produced by PostgREST and forwarded unchanged by the proxy.
        These operations do not reshape upstream failures, so the fields are
        PostgREST's, not the platform `ErrorResponse` used elsewhere.

        `code` and `message` are required so this schema cannot match a platform
        `ErrorResponse`: without them every object would validate here, which
        makes the `oneOf` on 400 match two alternatives and a strict validator
        reject a legitimate response.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: PostgREST or Postgres error code
          example: PGRST205
        message:
          type: string
          example: "Could not find the table 'public.nonexistent' in the schema cache"
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
          example: "Perhaps you meant the table 'public.posts'"
    ErrorResponse:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          description: Error code for programmatic handling
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid input data"
        statusCode:
          type: integer
          description: HTTP status code
          example: 400
        nextActions:
          type: string
          description: Suggested action to resolve the error
          example: "Check the request body format"

    Record:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Auto-generated UUID
        createdAt:
          type: string
          format: date-time
          description: Timestamp when record was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when record was last updated
      additionalProperties: true
      description: Base record structure with system fields

security:
  - bearerAuth: []
  - apiKey: []